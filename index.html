<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>高项冲刺刷题</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f4;
      --panel: #ffffff;
      --text: #15191f;
      --muted: #667085;
      --line: #d9ded6;
      --brand: #12685f;
      --brand-weak: #e5f2ef;
      --accent: #a84f10;
      --wrong: #b42318;
      --wrong-weak: #fdecea;
      --right: #087443;
      --right-weak: #e7f6ed;
      --shadow: 0 -8px 24px rgba(16, 24, 40, 0.08);
    }
    body.dark {
      color-scheme: dark;
      --bg: #101410;
      --panel: #181d19;
      --text: #eef3ed;
      --muted: #a3ad9f;
      --line: #343d35;
      --brand: #64c4b5;
      --brand-weak: #19332f;
      --accent: #f0a35d;
      --wrong: #ff8a80;
      --wrong-weak: #3b1d1a;
      --right: #69d48f;
      --right-weak: #173222;
      --shadow: 0 -8px 24px rgba(0, 0, 0, 0.28);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.58;
    }
    body.recite .dock { display: none; }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(14px);
    }
    .topbar, main, .dock-inner {
      width: min(1040px, 100%);
      margin: 0 auto;
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
    }
    .top-info {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .counter {
      color: var(--text);
      font-size: 15px;
      font-weight: 850;
      overflow-wrap: anywhere;
    }
    .top-stars {
      margin-left: 8px;
      color: var(--accent);
      font-weight: 900;
      letter-spacing: 1px;
    }
    .context-line {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .filter-popover {
      position: relative;
    }
    .filter-panel {
      display: none;
      position: fixed;
      top: 50px;
      right: 10px;
      left: 10px;
      max-width: 680px;
      margin-left: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 32px rgba(16, 24, 40, 0.16);
    }
    .filter-popover.open .filter-panel {
      display: grid;
      gap: 8px;
    }
    .filters {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 0.8fr;
      gap: 8px;
    }
    main {
      padding: 10px 12px 76px;
    }
    body.recite main { padding-bottom: 10px; }
    .question-card {
      position: relative;
      min-height: calc(100vh - 134px);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      touch-action: pan-y;
    }
    .edge-nav {
      display: none;
      position: absolute;
      top: 0;
      bottom: 0;
      width: 22%;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: transparent;
      z-index: 1;
    }
    .edge-nav.prev { left: 0; }
    .edge-nav.next { right: 0; }
    .stem {
      margin: 0 0 18px;
      font-size: 23px;
      font-weight: 850;
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .options {
      display: grid;
      gap: 10px;
    }
    .option {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 12px;
      text-align: left;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    body.recite .option { cursor: default; }
    .option .label {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: color-mix(in srgb, var(--line) 54%, var(--panel));
      font-weight: 850;
      line-height: 1;
    }
    .option .copy {
      align-self: center;
      overflow-wrap: anywhere;
      word-break: break-word;
      min-width: 0;
    }
    .option.selected {
      border-color: var(--brand);
      background: var(--brand-weak);
    }
    .option.correct {
      border-color: var(--right);
      background: var(--right-weak);
    }
    .option.correct .label {
      background: var(--right);
      color: var(--panel);
    }
    .option.wrong {
      border-color: var(--wrong);
      background: var(--wrong-weak);
    }
    .option.wrong .label {
      background: var(--wrong);
      color: var(--panel);
    }
    .answer-panel {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-left: 4px solid var(--brand);
      background: color-mix(in srgb, var(--brand-weak) 54%, var(--panel));
    }
    .answer-panel.visible { display: block; }
    .answer-line {
      margin: 0 0 10px;
      font-weight: 850;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .result-right { color: var(--right); }
    .result-wrong { color: var(--wrong); }
    .explanation {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .empty {
      margin-top: 20px;
      padding: 18px;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
    }
    .dock {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 4;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 95%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .dock-inner {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    select, button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    select {
      width: 100%;
      min-width: 0;
      padding: 0 8px;
      font-size: 13px;
    }
    button {
      padding: 0 8px;
      font-weight: 750;
      cursor: pointer;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    button:disabled {
      color: var(--muted);
      background: color-mix(in srgb, var(--line) 25%, var(--panel));
      cursor: not-allowed;
    }
    .primary {
      background: var(--brand);
      border-color: var(--brand);
      color: var(--panel);
    }
    .desktop-nav { display: block; }
    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 7px 8px;
      }
      .top-actions { gap: 4px; }
      .top-actions button { min-height: 32px; padding: 0 7px; font-size: 12px; }
      .context-line { font-size: 11px; }
      main { padding: 8px 8px 68px; }
      body.recite main { padding-bottom: 8px; }
      .question-card {
        min-height: calc(100vh - 116px);
        padding: 15px;
      }
      body.recite .question-card {
        min-height: calc(100vh - 56px);
      }
      .stem { font-size: 21px; }
      .edge-nav { display: block; }
      .desktop-nav { display: none; }
      .dock-inner { grid-template-columns: repeat(3, 1fr); }
      .filters { grid-template-columns: 1fr; }
      .filter-panel { top: 46px; }
    }
    @media (min-width: 900px) {
      .question-card { padding: 28px; }
      .stem { font-size: 25px; }
      .option { min-height: 62px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="top-info">
        <div class="counter"><span id="counter">加载中</span><span class="top-stars" id="topStars"></span></div>
        <div class="context-line" id="contextLine"></div>
      </div>
      <div class="top-actions">
        <div class="filter-popover" id="filterPopover">
          <button id="filterBtn">筛选</button>
          <div class="filter-panel">
            <div class="filters">
              <select id="chapterFilter" aria-label="章节"></select>
              <select id="sectionFilter" aria-label="考点"></select>
              <select id="statusFilter" aria-label="状态">
                <option value="all">全部题目</option>
                <option value="unanswered">未做</option>
                <option value="wrong">错题</option>
                <option value="answered">已做</option>
              </select>
            </div>
          </div>
        </div>
        <button id="modeBtn" class="primary">背题</button>
        <button id="themeBtn">夜间</button>
      </div>
    </div>
  </header>

  <main>
    <section id="questionHost"></section>
  </main>

  <nav class="dock" aria-label="刷题控制">
    <div class="dock-inner">
      <button id="prevBtn" class="desktop-nav">上一题</button>
      <button id="toggleAnswerBtn">解析</button>
      <button id="randomBtn">随机</button>
      <button id="resetCurrentBtn">重做</button>
      <button id="nextBtn" class="desktop-nav">下一题</button>
    </div>
  </nav>

  <script>
    const STORAGE_KEY = "gaoxiangQuizProgress.v1";
    const UI_KEY = "gaoxiangQuizUi.v2";
    const state = {
      all: [],
      filtered: [],
      index: 0,
      showAnswer: false,
      mode: "practice",
      theme: "light",
      progress: loadProgress(),
      touchStartX: 0,
      touchStartY: 0,
      restoring: true,
    };

    const els = {
      counter: document.querySelector("#counter"),
      topStars: document.querySelector("#topStars"),
      contextLine: document.querySelector("#contextLine"),
      chapterFilter: document.querySelector("#chapterFilter"),
      sectionFilter: document.querySelector("#sectionFilter"),
      statusFilter: document.querySelector("#statusFilter"),
      filterPopover: document.querySelector("#filterPopover"),
      filterBtn: document.querySelector("#filterBtn"),
      host: document.querySelector("#questionHost"),
      prev: document.querySelector("#prevBtn"),
      next: document.querySelector("#nextBtn"),
      mode: document.querySelector("#modeBtn"),
      theme: document.querySelector("#themeBtn"),
      toggle: document.querySelector("#toggleAnswerBtn"),
      resetCurrent: document.querySelector("#resetCurrentBtn"),
      random: document.querySelector("#randomBtn"),
    };

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function loadUi() {
      try {
        return JSON.parse(localStorage.getItem(UI_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    }

    function saveUi() {
      localStorage.setItem(UI_KEY, JSON.stringify({
        index: state.index,
        showAnswer: state.showAnswer,
        mode: state.mode,
        theme: state.theme,
        chapter: els.chapterFilter.value,
        section: els.sectionFilter.value,
        status: els.statusFilter.value,
      }));
    }

    function applyTheme() {
      document.body.classList.toggle("dark", state.theme === "dark");
      els.theme.textContent = state.theme === "dark" ? "日间" : "夜间";
    }

    function applyMode() {
      document.body.classList.toggle("recite", state.mode === "recite");
      els.mode.textContent = state.mode === "recite" ? "练习" : "背题";
      els.toggle.disabled = state.mode === "recite";
    }

    function chapterLabel(q) {
      return q.chapter ? `第${q.chapter.number}章 ${q.chapter.title}` : "未分章";
    }

    function sectionLabel(q) {
      if (!q.section) return "未分考点";
      const stars = q.section.priority || "";
      return `考点${q.section.number} ${q.section.title}${stars ? " " + stars : ""}`;
    }

    function answerText(q) {
      return Array.isArray(q.answer) ? q.answer.join("") : String(q.answer || "");
    }

    function isAnswered(q) {
      return Boolean(state.progress[q.id]?.answeredAt);
    }

    function isWrong(q) {
      return state.progress[q.id]?.isCorrect === false;
    }

    function uniqueBy(items, getKey) {
      const map = new Map();
      items.forEach(item => {
        const key = getKey(item);
        if (!map.has(key)) map.set(key, item);
      });
      return [...map.values()];
    }

    function fillFilters(ui = {}) {
      const chapters = uniqueBy(state.all, chapterLabel);
      els.chapterFilter.innerHTML = `<option value="">全部章节</option>` +
        chapters.map(q => `<option value="${escapeAttr(chapterLabel(q))}">${escapeHtml(chapterLabel(q))}</option>`).join("");
      if ([...els.chapterFilter.options].some(option => option.value === ui.chapter)) {
        els.chapterFilter.value = ui.chapter;
      }
      updateSectionFilter(ui.section);
      if ([...els.statusFilter.options].some(option => option.value === ui.status)) {
        els.statusFilter.value = ui.status;
      }
    }

    function updateSectionFilter(preferred = els.sectionFilter.value) {
      const chapterValue = els.chapterFilter.value;
      const source = chapterValue ? state.all.filter(q => chapterLabel(q) === chapterValue) : state.all;
      const sections = uniqueBy(source, sectionLabel);
      els.sectionFilter.innerHTML = `<option value="">全部考点</option>` +
        sections.map(q => `<option value="${escapeAttr(sectionLabel(q))}">${escapeHtml(sectionLabel(q))}</option>`).join("");
      if ([...els.sectionFilter.options].some(option => option.value === preferred)) {
        els.sectionFilter.value = preferred;
      }
    }

    function filteredQuestions() {
      const chapterValue = els.chapterFilter.value;
      const sectionValue = els.sectionFilter.value;
      const statusValue = els.statusFilter.value;
      return state.all.filter(q => {
        const statusOk =
          statusValue === "all" ||
          (statusValue === "unanswered" && !isAnswered(q)) ||
          (statusValue === "wrong" && isWrong(q)) ||
          (statusValue === "answered" && isAnswered(q));
        return (!chapterValue || chapterLabel(q) === chapterValue) &&
          (!sectionValue || sectionLabel(q) === sectionValue) &&
          statusOk;
      });
    }

    function applyFilters({ keepIndex = false } = {}) {
      const previousId = state.filtered[state.index]?.id;
      state.filtered = filteredQuestions();
      if (keepIndex && previousId) {
        const nextIndex = state.filtered.findIndex(q => q.id === previousId);
        state.index = nextIndex >= 0 ? nextIndex : 0;
      } else {
        state.index = Math.min(state.index, Math.max(state.filtered.length - 1, 0));
      }
      state.showAnswer = state.mode === "recite" ? true : state.showAnswer;
      render();
    }

    function answerQuestion(q, selected) {
      if (state.mode === "recite") return;
      const correct = answerText(q).includes(selected);
      const previous = state.progress[q.id] || {};
      state.progress[q.id] = {
        selected,
        isCorrect: correct,
        attempts: (previous.attempts || 0) + 1,
        correctAttempts: (previous.correctAttempts || 0) + (correct ? 1 : 0),
        wrongAttempts: (previous.wrongAttempts || 0) + (correct ? 0 : 1),
        answeredAt: new Date().toISOString(),
      };
      state.showAnswer = true;
      saveProgress();
      render();
    }

    function resetCurrent() {
      const q = state.filtered[state.index];
      if (!q) return;
      delete state.progress[q.id];
      saveProgress();
      state.showAnswer = state.mode === "recite";
      render();
    }

    function contextFor(q) {
      if (!q) return "";
      const bits = [
        chapterLabel(q),
        q.section ? `考点${q.section.number} ${q.section.title}` : "未分考点",
        q.source || "",
        `页 ${q.pageStart}${q.pageEnd !== q.pageStart ? "-" + q.pageEnd : ""}`,
      ];
      return bits.filter(Boolean).join(" · ");
    }

    function render() {
      applyMode();
      applyTheme();
      const total = state.filtered.length;
      els.counter.textContent = total ? `${state.index + 1} / ${total}` : "0 / 0";
      els.topStars.textContent = "";
      els.prev.disabled = state.index <= 0;
      els.next.disabled = state.index >= total - 1;
      els.toggle.textContent = state.showAnswer ? "隐藏" : "解析";

      if (!total) {
        els.contextLine.textContent = "没有匹配的题目";
        els.host.innerHTML = `<div class="empty">没有匹配的题目</div>`;
        saveUi();
        return;
      }

      const q = state.filtered[state.index];
      els.topStars.textContent = q.section?.priority || "";
      els.contextLine.textContent = contextFor(q);
      const progress = state.progress[q.id] || {};
      const answer = answerText(q);
      const showJudgement = Boolean(progress.selected) || state.mode === "recite";
      const answerVisible = state.mode === "recite" || state.showAnswer || Boolean(progress.selected);
      const resultText = progress.selected && state.mode !== "recite"
        ? progress.isCorrect ? "回答正确" : `回答错误，你选了 ${progress.selected}`
        : "";

      const optionHtml = Object.entries(q.options || {}).map(([key, value]) => {
        let classes = "";
        if (progress.selected === key) classes += " selected";
        if (showJudgement && answer.includes(key)) classes += " correct";
        if (showJudgement && progress.selected === key && !answer.includes(key)) classes += " wrong";
        return `<button class="option${classes}" data-option="${escapeAttr(key)}">
          <span class="label">${escapeHtml(key)}</span>
          <span class="copy">${escapeHtml(value)}</span>
        </button>`;
      }).join("");

      els.host.innerHTML = `<article class="question-card">
        <button class="edge-nav prev" id="edgePrev" aria-label="上一题"></button>
        <button class="edge-nav next" id="edgeNext" aria-label="下一题"></button>
        <p class="stem">${escapeHtml(q.stem || "")}</p>
        <div class="options">${optionHtml}</div>
        <div class="answer-panel ${answerVisible ? "visible" : ""}">
          ${resultText ? `<p class="answer-line ${progress.isCorrect ? "result-right" : "result-wrong"}">${escapeHtml(resultText)}</p>` : ""}
          <p class="answer-line">答案：${escapeHtml(answer || "未识别")}</p>
          <p class="explanation">${escapeHtml(q.explanation || "暂无解析")}</p>
        </div>
      </article>`;

      document.querySelectorAll(".option").forEach(button => {
        button.addEventListener("click", () => answerQuestion(q, button.dataset.option));
      });
      const card = document.querySelector(".question-card");
      card.addEventListener("touchstart", handleTouchStart, { passive: true });
      card.addEventListener("touchend", handleTouchEnd, { passive: true });
      document.querySelector("#edgePrev").addEventListener("click", () => go(-1));
      document.querySelector("#edgeNext").addEventListener("click", () => go(1));
      saveUi();
    }

    function go(delta) {
      const nextIndex = state.index + delta;
      if (nextIndex < 0 || nextIndex >= state.filtered.length) return;
      state.index = nextIndex;
      state.showAnswer = state.mode === "recite";
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function handleTouchStart(event) {
      const touch = event.changedTouches[0];
      state.touchStartX = touch.clientX;
      state.touchStartY = touch.clientY;
    }

    function handleTouchEnd(event) {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - state.touchStartX;
      const dy = touch.clientY - state.touchStartY;
      if (Math.abs(dx) < 72 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      go(dx < 0 ? 1 : -1);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    els.filterBtn.addEventListener("click", event => {
      event.stopPropagation();
      els.filterPopover.classList.toggle("open");
    });
    document.addEventListener("click", event => {
      if (!els.filterPopover.contains(event.target)) {
        els.filterPopover.classList.remove("open");
      }
    });
    els.chapterFilter.addEventListener("change", () => {
      updateSectionFilter("");
      state.index = 0;
      applyFilters();
    });
    els.sectionFilter.addEventListener("change", () => {
      state.index = 0;
      applyFilters();
    });
    els.statusFilter.addEventListener("change", () => {
      state.index = 0;
      applyFilters();
    });
    els.prev.addEventListener("click", () => go(-1));
    els.next.addEventListener("click", () => go(1));
    els.mode.addEventListener("click", () => {
      state.mode = state.mode === "recite" ? "practice" : "recite";
      state.showAnswer = state.mode === "recite";
      render();
    });
    els.theme.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      render();
    });
    els.toggle.addEventListener("click", () => {
      if (state.mode === "recite") return;
      state.showAnswer = !state.showAnswer;
      render();
    });
    els.resetCurrent.addEventListener("click", resetCurrent);
    els.random.addEventListener("click", () => {
      if (!state.filtered.length) return;
      state.index = Math.floor(Math.random() * state.filtered.length);
      state.showAnswer = state.mode === "recite";
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") go(-1);
      if (event.key === "ArrowRight") go(1);
    });

    const savedUi = loadUi();
    state.mode = savedUi.mode || state.mode;
    state.theme = savedUi.theme || state.theme;
    state.showAnswer = Boolean(savedUi.showAnswer);
    applyMode();
    applyTheme();

    fetch("questions.json")
      .then(response => {
        if (!response.ok) throw new Error("questions.json not found");
        return response.json();
      })
      .then(data => {
        state.all = data.questions || [];
        fillFilters(savedUi);
        state.filtered = filteredQuestions();
        state.index = Math.min(Number(savedUi.index || 0), Math.max(state.filtered.length - 1, 0));
        state.showAnswer = state.mode === "recite" ? true : Boolean(savedUi.showAnswer);
        render();
      })
      .catch(error => {
        els.counter.textContent = "未加载";
        els.topStars.textContent = "";
        els.contextLine.textContent = "无法加载题库";
        els.host.innerHTML = `<div class="empty">请确认 questions.json 与当前 HTML 在同一目录，并通过本地服务或 GitHub Pages 打开。</div>`;
        console.error(error);
      });
  </script>
</body>
</html>
